spring.application.name=backend
server.port=8084

sandbox.image=trainer-sandbox
ai.service.url=http://localhost:8100

# Datasource
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/trainer}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:trainer_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:trainer_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Redis
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_REDIS_PASSWORD:}

# JWT
jwt.secret=${JWT_SECRET:dev-secret-change-in-production-must-be-at-least-64-chars-long!!}
jwt.access-expiry-seconds=${JWT_ACCESS_EXPIRY_SECONDS:900}
jwt.refresh-expiry-seconds=${JWT_REFRESH_EXPIRY_SECONDS:604800}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
